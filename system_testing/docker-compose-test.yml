version: "3.8"

services:
  # 1. THE DATABASE (Replaces SQLite file)
  postgres:
    image: postgres:15-alpine
    container_name: odos_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user} # Reads from .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password} # Reads from .env
      POSTGRES_DB: ${POSTGRES_DB:-odos_observability}
    ports:
      - "5432:5432" # Expose to host so ./run init-db works
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

