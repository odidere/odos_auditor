receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging] # Traces go to logs (and your Postgres via the Python code)
    metrics:
      receivers: [otlp]
      exporters: [prometheus, logging]