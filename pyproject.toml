[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odos-auditor"
version = "0.2.0"
description = "Warehouse cost anomaly detection for Snowflake and BigQuery, with human-reviewed AI rewrites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.27,<3",
    "pyyaml>=6.0",
    "sqlglot>=23.0.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.7"]
bigquery = ["google-cloud-bigquery>=3.17"]
postgres = ["psycopg2-binary>=2.9.9"]
ai = ["openai>=1.40", "google-genai>=1.0"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
api = ["fastapi>=0.110", "uvicorn>=0.28"]
ui = ["streamlit>=1.37", "plotly>=5.19", "pandas>=2.2", "fpdf2>=2.7"]
airflow = ["apache-airflow-providers-snowflake>=5.0"]
dagster = ["dagster>=1.6"]
dev = ["pytest>=8.1", "pytest-mock>=3.12", "httpx>=0.27", "pandas>=2.2", "fpdf2>=2.7", "fastapi>=0.110"]
all = ["odos-auditor[snowflake,bigquery,postgres,ai,otel,api,ui]"]

[project.scripts]
odos = "odos.cli:main"

[tool.setuptools.packages.find]
include = ["odos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
